source-file ~/code/my-playground/dotfiles/tmux/tmux.reset.conf

# ---  Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# --- Plugin Configurations ---

# Enable auto-restore on tmux server start
set -g @continuum-restore 'on'

# Set save interval in minutes (default is 15)
set -g @continuum-save-interval '15'

# Disable continuum status line indicator (ponytail: script runs every status update)
set -g @continuum-boot 'off'
set -g status-right "#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"

# Manual save keybinding (prefix + Ctrl-s to save session)
bind-key C-s run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"

# Open tuxedo with prefix + t (in a new window)
bind-key t new-window -n "tuxedo" "TODO_DIR=~/todolist/ TODO_FILE=~/todolist/todolist.txt tuxedo"

# Open garden-task with prefix + T (in a new window)
bind-key T new-window -n "garden-task" "TODO_FILE=~/code/my-playground/future/todo.txt tuxedo"

# Sessionist uses default keybindings (no config needed)
# prefix + g - session switcher
# prefix + C - create new session
# prefix + X - kill session without detaching

# Native popup (ponytail: replaces floax plugin, faster)
bind p display-popup -E -w 80% -h 80% -d '#{pane_current_path}' -b rounded

# tmux-fingers Config (Rust-based, faster than extrakto)
set -g @fingers-key 'Tab'
set -g @fingers-compact-hints 0  # Show hints with more context
set -g @fingers-hint-format "#[fg=yellow,bold]%s"

# tmux-fzf conig
TMUX_FZF_ORDER="session|window|pane|command|keybinding"
bind-key "o" run-shell "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"
set -g @tmux-fzf-launch-key 'F' # Prefix + f opens the full menu
set -g @tmux-fzf-options '-p -w 80% -h 70% --color=bw'

# Catppuccin Theme Config (v2.1.3 style)
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_2},fg=#{@thm_surface_0}]"
set -g @catppuccin_window_middle_separator " #[fg=#{@thm_surface_0}]█"
set -g @catppuccin_window_right_separator " #[bg=#{@thm_overlay_2},fg=default]#[bg=default,fg=#{@thm_overlay_2}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator " #[fg=#{@thm_surface_0}]█"
set -g @catppuccin_window_current_right_separator " #[bg=#{@thm_mauve},fg=default]#[bg=default,fg=#{@thm_mauve}]"
set -g @catppuccin_status_left_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_2},fg=#{@thm_surface_0}]"
set -g @catppuccin_status_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_status_left "session"
set -g @catppuccin_status_right "ssh_session" # date_time"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_status_background "black"
set -g @catppuccin_pane_active_border_style "yellow"
set -g @catppuccin_pane_border_style "teal"

# Status Bar Look
set -g status-left-length 20
set -g status-right-length 80
set -g status-justify "left"
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -g window-style "bg=#000000,fg=default"
set -g window-active-style "bg=#000000,fg=default"

#---setting env (ponytail: add /usr/sbin for scutil)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin"

# --- Initialize TPM (Keep this at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'

# --- Override backgrounds to pitch black (must be after TPM) ---
set -g status-style "bg=#000000"
set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"

# --- Pane border colors (override theme) ---
set -g pane-border-style "fg=colour8"        # Inactive panes: dark gray
set -g pane-active-border-style "fg=yellow"  # Active pane: yellow

# --- Performance fixes (override plugins) ---
# ponytail: continuum script runs every status update, kills performance
set -g status-right "#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"
set -g status-interval 15  # reduce from 5s

